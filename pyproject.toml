[project]
name = "sickchill"
version = "2024.3.1"
description = "Automatic Video Library Manager for TV Shows"
readme = "README.md"

license = "GPL-3.0-or-later"
license-files = [
    "LICENSE.md",
    "COPYING.txt",
]

authors = [
    { name = "Dustyn Gibson", email = "miigotu@gmail.com" },
    { name = "BKSteve", email = "stephen.rieger@gmail.com" },
]

maintainers = [
    { name = "Dustyn Gibson", email = "miigotu@gmail.com" },
]

requires-python = ">=3.10,<4.0"

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13"
]

dependencies = [
    "appdirs>=1.4.4",
    "babelfish>=0.6.0",
    "beautifulsoup4>=4.15.0",
    "beekeeper-alt>=2022.9.3",
    "bencode.py (>=4.0.0,<5.0.0)",
    "cachecontrol>=0.13.1,<0.15.0",
    "configobj>=5.0.6",
    "deluge-client>=1.9.0",
    "enzyme>=0.5.0,<0.6.0",
    "gntp>=1.0.3",
    "greenlet>=2.0.2",
    "guessit>=3.3.1",
    "html5lib>=1.1",
    "ifaddr>=0.1.7,<0.3.0",
    "imagesize (>=1.2.0,<2.0.0)",
    "imdbpie>=5.7.1",
    "Js2Py>=0.71,<0.75",
    "jsonrpclib-pelix>=0.4.2,<1.2.0",
    "kodipydent-alt>=2022.9.3",
    "lxml>=4.9.1,<7.0.0",
    "Mako >=1.1.4",
    "markdown2>=2.4.0",
    "new-rtorrent-python>=1.0.1-alpha.0",
    "packaging>=24.2,<27.0",
    "profilehooks>=1.12.0",
    "putio.py (>=8.7.0,<9.0.0)",
    "pymediainfo>=5.0.3,<8.0.0",
    "PyNMA >=1.0",
    "pyOpenSSL>=20.0.1,<26.3.0",
    "python-dateutil>=2.8.1",
    "python-slugify>=4.0.1,<9.0.0",
    "python-twitter>=3.5",
    "python3-fanart>=2.0.0",
    "qbittorrent-api>=2021.3.18,<2027.0.0",
    "rarfile>=4.0",
    "requests>=2.32.2",
    "Send2Trash>=1.5.0",
    "SQLAlchemy (>=2.0.0,<3.0.0)",
    "stevedore>=5.1.0",
    "subliminal>=2.3.2",
    "timeago>=1.0.15",
    "tmdbsimple>=2.9.6",
    "tornado>=6.4",
    "tus.py (>=1.3.4,<2.0.0)",
    "tvdbsimple>=1.0.6",
    "Unidecode>=1.2.0",
    "validators>=0.30.0,<0.36.0",
    "virtualenv>=20.10.0",
    "win-inet-pton>=1.1.0",
]

[tool.poetry]
packages = [
    { include = "sickchill" },
    { include = "SickChill.py" },
    { include = "frontend" }
]

[project.urls]
Homepage = "https://sickchill.github.io"
Repository = "https://github.com/sickchill/sickchill"
Changelog = "https://github.com/SickChill/SickChill/blob/master/CHANGES.md"
News = "https://raw.githubusercontent.com/SickChill/sickchill.github.io/master/sickchill-news/news.md"
Issues = "https://discord.com/channels/502612977271439372/1048317980343283733"
Discord = "https://discord.com/invite/U8WPBdf"
Donate = "https://github.com/SickChill/SickChill/wiki/Donations"

[project.scripts]
SickChill = "SickChill:main"
sickchill = "SickChill:main"

[dependency-groups]
dev = [
    "Babel>=2.9.0",
    "coveralls>=4.0,<5.0",
    "flask-sqlalchemy>=3.0.3,<4.0.0",
    "Flask>=2.2.2,<4.0.0",
    "mock>=4.0.3,<6.0.0",
    "po2json>=0.2.2",
    "poethepoet>=0.48.0,<0.49",
    "pre-commit>=2.20,<5.0",
    "pytest-cov>=3,<8",
    "pytest-timeout>=2.0,<3.0",
    "pytest>=9.1.1,<10.0.0",
    "ruff>=0.4.0,<1.0",
    "urllib3<3.0.0",
]
types = [
    "pyaes>=1.6.1",
    "types-attrs>=19.1.0",
    "types-chardet>=5.0.4",
    "types-pyOpenSSL>=22.0.10,<26.3.0",
    "types-python-dateutil>=2.8.19",
    "types-python-slugify>=6.1,<9.0",
    "types-pytz>=2022.2.1,<2027.0.0",
    "types-requests>=2.28.11",
    "types-setuptools>=83.0.0.20260706",
    "types-six>=1.16.20",
]

[build-system]
requires = ["poetry-core>=2.2,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 160
builtins = ["_"]
target-version = "py310"
exclude = [
    ".eggs",
    ".git",
    "__pycache__",
    "docs/source/conf.py",
    "build",
    "dist",
    ".venv",
    ".vscode",
]

[tool.ruff.lint]
ignore = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D106",
    "D200",
    "D205",
    "D400",
    "D401",
    "D403",
    "D406",
    "D407",
    "E402",
    "F601",
    "PT009",
    "PT017",
    "S101",
]
extend-select = ["F821", "I"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["sickchill"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests", "sickchill", "SickChill.py"]
addopts = "--cov=sickchill --cov-report xml --no-cov-on-fail -v --timeout=120"
filterwarnings = ['ignore:.*telnetlib.*is deprecated:DeprecationWarning']

[tool.poe.tasks]
pytest = "pytest"
yarn = "yarn"
xo = "xo"
ava = "ava"

_format_check = {cmd = "ruff format --check --diff .", help = "Check code formatting using ruff"}
_isort_check = {cmd = "ruff check --select I .", help = "Check import order"}
flake8 = {cmd = "ruff check --select F821 sickchill tests SickChill.py", help = "Check for undefined variables"}

format = {cmd = "ruff format .", help = "Reformat code using ruff"}
isort = {cmd = "ruff check --select I --fix .", help = "Fix import order"}

test_providers = {cmd = "pytest tests/sickchill_tests/providers/torrent/test_parsing.py", help = "Run provider tests"}
crowdin_upload = "crowdin-cli-py upload sources -c .github/crowdin.yml"
crowdin_download = "crowdin-cli-py download -c .github/crowdin.yml"
po2json = "po2json --format jed "

lint = ["_format_check", "_isort_check", "flake8"]

_poetry_update = {shell = "poetry update", help = "update python dependancies"}
_yarn_upgrade = {cmd = "yarn upgrade", help = "update yarn dependancies"}
_add_locks = {shell = "git add pyproject.toml yarn.lock", help = "Add yarn and poetry lock files"}
depup = ["_poetry_update", "_yarn_upgrade", "_add_locks"]

update_translations = ["babel_extract", "babel_update", "crowdin_upload", "crowdin_download", "babel_compile", "po2json"]
update_dependencies = {shell = "poetry update && yarn upgrade && git add pyproject.toml yarn.lock"}

test = [
    { ref = "lint" },
    { cmd = "yarn test" },
    { cmd = "pytest" }
]

babel_extract = """
pybabel extract
--project=sickchill
--mapping-file=.github/babel-mapping.cfg
--width=80
--charset=utf-8
--output-file=sickchill/locale/messages.pot
--input-dirs=sickchill
--keywords=_n:1,2
--copyright-holder=SickChill
--msgid-bugs-address=miigotu@gmail.com
--add-comments="TRANSLATORS:"
--sort-output
"""

babel_compile = """
pybabel compile
--mapping-file=.github/babel-mapping.cfg
--directory=sickchill/locale
"""

babel_init = """
pybabel init
--mapping_file=.github/babel-mapping.cfg
--output-dir=sickchill/locale
--input-file=sickchill/locale/messages.pot
"""

babel_update = """
pybabel update
--output-dir=sickchill/locale
--input-file=sickchill/locale/messages.pot
--ignore-obsolete
--previous
"""

