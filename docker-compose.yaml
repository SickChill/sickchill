services:
  sickchill:
    image: sickchill/sickchill:develop
    # image: sickchill/sickchill:latest
    container_name: sickchill
    restart: unless-stopped

    # Do NOT set "user:" here when using PUID/PGID (recommended for NAS).
    # The entrypoint runs as root to set up permissions + persistent venv, then drops privileges.
    # user: "1026:100"   # only for advanced/manual use

    environment:
      # NAS / Synology friendly settings (adjust to your DSM user)
      - PUID=1026          # your DSM user ID (or 1000 for many systems)
      - PGID=100           # usually the "users" group, or "video" group if you added container to it
      - TZ=America/New_York
      - UMASK=002
      - DATADIR=/data

    volumes:
      # Main persistent folder - AFTER FIRST START this will contain:
      #   .venv/          (full Python environment + sickchill package - now lives here!)
      #   cache/ logs/
      #   config.ini sickchill.db etc
      - /docker/sickchill/data:/data

      # Optional media folders (adjust paths for your NAS)
      # - /docker/downloads:/downloads
      # - /your_media/Series:/tv

      # Timezone (optional as assigned above)
      # - /etc/localtime:/etc/localtime:ro

    ports:
      - "8081:8081"
